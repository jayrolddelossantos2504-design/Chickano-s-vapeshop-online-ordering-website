<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome | Chickano's Vapeshop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <style>
    :root {
      --primary: #ffcc00;
      --dark: #0d0d0d;
      --light: #f1f1f1;
      --gray: #333;
    }
    
    body {
      margin: 0;
      background: var(--dark);
      color: var(--light);
      font-family: 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.8)), 
                  url('https://bgfons.com/uploads/smoke/smoke_texture2741.jpg') center/cover no-repeat fixed;
    }

    .welcome-container {
      max-width: 100%;
      width: 100%;
      height: 100vh;
      padding: 2rem 1.5rem;
      background: rgba(20, 20, 20, 0.9);
      border-radius: 0;
      box-shadow: none;
      backdrop-filter: blur(10px);
      border: none;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .welcome-header h1 {
      color: var(--primary);
      font-weight: 700;
      font-size: 2.2rem;
      margin: 1.5rem 0 0.8rem;
      text-transform: uppercase;
      line-height: 1.2;
    }

    .welcome-header p {
      color: #aaa;
      font-size: 1.1rem;
      margin: 0 auto 3rem;
      max-width: 80%;
      line-height: 1.6;
    }

    .hero-logo {
      max-width: 180px;
      height: auto;
      margin: 0 auto 2rem;
      filter: drop-shadow(0 0 15px rgba(255, 204, 0, 0.4));
    }

    .welcome-buttons {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      width: 100%;
      max-width: 320px;
      margin: 0 auto;
    }

    .btn-welcome {
      background: linear-gradient(45deg, var(--primary), #ffaa00);
      border: none;
      color: #000;
      font-weight: 600;
      padding: 16px 28px;
      border-radius: 30px;
      font-size: 1.1rem;
      transition: all 0.3s ease;
      text-decoration: none;
      display: block;
      width: 100%;
      margin: 0;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    .btn-welcome:hover {
      background: linear-gradient(45deg, #ffd633, #ffbb33);
      transform: translateY(-3px);
      box-shadow: 0 6px 20px rgba(255, 204, 0, 0.3);
      color: #000;
    }

    .btn-outline-welcome {
      background: rgba(255, 255, 255, 0.1);
      border: 2px solid var(--primary);
      color: var(--primary);
      backdrop-filter: blur(5px);
    }

    .btn-outline-welcome:hover {
      background: rgba(255, 204, 0, 0.1);
      color: var(--light);
    }
  </style>
</head>
<body>
  <div class="welcome-container">
    <div class="welcome-header">
      <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Chickano's Vapeshop" class="hero-logo">
      <h1>Welcome to Chickano's</h1>
      <p>Your trusted source for premium vapes, e-juices, and accessories.</p>
    </div>
    
    <div class="welcome-buttons">
      <a href="{{ url_for('login') }}" class="btn btn-welcome">
        <i class="bi bi-box-arrow-in-right me-2"></i>Log In
      </a>
      <a href="{{ url_for('signup') }}" class="btn btn-welcome btn-outline-welcome">
        <i class="bi bi-person-plus me-2"></i>Sign Up
      </a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
