<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Chickano's Vapeshop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <style>
    :root {
      --primary: #ffcc00;
      --dark: #0d0d0d;
      --light: #f1f1f1;
      --gray: #333;
    }
    
    body {
      margin: 0;
      background: var(--dark);
      color: var(--light);
      font-family: 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.8)), 
                  url('https://bgfons.com/uploads/smoke/smoke_texture2741.jpg') center/cover no-repeat fixed;
    }

    .login-container {
      max-width: 450px;
      width: 90%;
      padding: 1.75rem;
      background: rgba(20, 20, 20, 0.9);
      border-radius: 12px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      margin: 15px auto;
    }

    .login-header {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .login-header h2 {
      color: var(--primary);
      font-weight: 700;
      font-size: 1.75rem;
      margin: 0.75rem 0 0.4rem;
      text-transform: uppercase;
    }

    .login-header p {
      color: #aaa;
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
    }

    .form-label {
      color: #ddd;
      font-weight: 500;
      margin-bottom: 0.35rem;
      font-size: 0.92rem;
    }

    .form-control {
      background-color: #ffffff;
      border: 1px solid #444;
      color: var(--dark);
      padding: 0.6rem 0.9rem;
      border-radius: 6px;
      transition: all 0.2s ease;
      width: 100%;
      font-size: 0.95rem;
    }

    .form-control:focus {
      background-color: #ffffff;
      border-color: var(--primary);
      box-shadow: 0 0 0 0.25rem rgba(255, 204, 0, 0.25);
      color: var(--dark);
    }

    .btn-login {
      background: linear-gradient(45deg, var(--primary), #ffaa00);
      border: none;
      color: #000;
      font-weight: 600;
      padding: 0.5rem 1.5rem;
      width: 100%;
      border-radius: 25px;
      margin-top: 1.25rem;
      font-size: 1rem;
      transition: all 0.2s ease;
    }

    .btn-login:hover {
      background: linear-gradient(45deg, #ffd633, #ffbb33);
      transform: translateY(-3px);
      box-shadow: 0 6px 20px rgba(255, 204, 0, 0.3);
    }

    .register-link {
      text-align: center;
      margin-top: 1.25rem;
      color: #aaa;
      font-size: 0.9rem;
    }

    .register-link a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.3s ease;
    }

    .register-link a:hover {
      color: #ffd633;
      text-decoration: underline;
    }

    .alert {
      border-radius: 8px;
      border: none;
    }

    .alert-dismissible .btn-close {
      filter: invert(1) grayscale(100%) brightness(200%);
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-header">
      <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Chickano's Vapeshop" style="max-width: 160px; margin-bottom: 1rem;">
      <h2>Create an Account</h2>
      <p>Please fill in your details</p>
    </div>
    
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
            <i class="bi {% if category == 'success' %}bi-check-circle-fill{% else %}bi-exclamation-triangle-fill{% endif %} me-2"></i>
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    
    <form method="POST" action="{{ url_for('signup') }}">
      <div class="row g-2">
        <div class="col-md-6">
          <label for="f_name" class="form-label">First Name</label>
          <input type="text" class="form-control" id="f_name" name="f_name" required>
        </div>
        <div class="col-md-6">
          <label for="m_name" class="form-label">Middle (Optional)</label>
          <input type="text" class="form-control" id="m_name" name="m_name">
        </div>
      </div>
      <div class="mb-2">
        <label for="l_name" class="form-label">Last Name</label>
        <input type="text" class="form-control" id="l_name" name="l_name" required>
      </div>
      <div class="mb-2">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" name="email" required>
      </div>
      <div class="mb-2">
        <label for="password" class="form-label">Password</label>
        <div class="input-group">
          <input type="password" class="form-control" id="password" name="password" required>
          <button class="btn btn-light" type="button" id="togglePassword" style="background-color: white; border: 1px solid #444; border-left: none; border-radius: 0 6px 6px 0;">
            <i class="bi bi-eye text-dark" style="font-size: 0.9rem;"></i>
          </button>
        </div>
      </div>
      
      <button type="submit" class="btn btn-login">
        <i class="bi bi-person-plus me-2"></i>Sign Up
      </button>
    </form>
    
    <div class="register-link">
      Already have an account? <a href="{{ url_for('login') }}">Login here</a>
    </div>
  </div>
  
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Toggle password visibility
    document.getElementById('togglePassword').addEventListener('click', function() {
      const passwordInput = document.getElementById('password');
      const icon = this.querySelector('i');
      
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        icon.classList.remove('bi-eye');
        icon.classList.add('bi-eye-slash');
      } else {
        passwordInput.type = 'password';
        icon.classList.remove('bi-eye-slash');
        icon.classList.add('bi-eye');
      }
    });
  </script>
</body>
</html>
