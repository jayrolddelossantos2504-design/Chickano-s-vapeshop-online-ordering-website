<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Edit Product</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
  <h2 class="mb-4">Edit Product</h2>
  <form method="POST" action="{{ url_for('edit_product', product_id=product.id) }}">
    <div class="mb-3">
      <label class="form-label">Product Name</label>
      <input type="text" name="name" class="form-control" value="{{ product.name }}" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Description</label>
      <textarea name="description" class="form-control" required>{{ product.description }}</textarea>
    </div>
    <div class="mb-3">
      <label class="form-label">Price</label>
      <input type="number" step="0.01" name="price" class="form-control" value="{{ product.price }}" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Stock</label>
      <input type="number" name="stock" class="form-control" value="{{ product.stock }}" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Category ID</label>
      <input type="number" name="category" class="form-control" value="{{ product.category }}" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Image URL</label>
      <input type="text" name="image_url" class="form-control" value="{{ product.image_url }}">
    </div>
    <button type="submit" class="btn btn-primary">Update Product</button>
    <a href="{{ url_for('manage_products') }}" class="btn btn-secondary">Cancel</a>
  </form>
</div>
</body>
</html>
